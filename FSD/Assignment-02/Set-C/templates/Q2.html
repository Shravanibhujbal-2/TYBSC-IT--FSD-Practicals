<!DOCTYPE html>
<html>
<head>
    <title>Student Search</title>
</head>
<body>

<h2>Search Student</h2>

<form method="POST">

    <input type="text" name="name"
           value="{{ name }}"
           placeholder="Enter Student Name">

    <input type="submit" value="Search">

</form>

<h3>Search Result: {{ name }}</h3>

</body>
</html>
