<!DOCTYPE html>
<html>
<head>
    <title>Rectangle Area</title>
</head>
<body>

<h2>Calculate Area of Rectangle</h2>

<form method="POST">
    Length:
    <input type="number" name="length" value="{{ length }}">
    <br><br>

    Breadth:
    <input type="number" name="breadth" value="{{ breadth }}">
    <br><br>

    <input type="submit" value="Calculate">
</form>

<h3>Area = {{ result }}</h3>

</body>
</html>
